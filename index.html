        --font-family-body: "Archivo", sans-serif;

      body,
      button,
      input,
      textarea,
      select {

      bp-dropdown > * {

      /* Keep top utility bar space, hide Blog / Contact us / Customer login */
      .primaryNav__utilityNav {

      /* Banner CTA: dark navy + blue glow (login-style gradient) */
      .bannerCta.-gradientCobalt {
        background-color: #050811 !important;
        background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat !important;
        background-position: 0 0, 0 0, center, center, center !important;
      }

      /* Meet the Experts — executive team cards (company page) */
      .wnExecTeam {
        padding: clamp(3.25rem, 6vw, 5rem) 1.25rem !important;
      }

      .wnExecTeam__inner {
        width: min(920px, 100%);
        margin: 0 auto;
        text-align: center;
      }

      .wnExecTeam__header {
        max-width: 40rem;
        margin: 0 auto clamp(2rem, 4vw, 2.75rem);
      }

      .wnExecTeam__title {
        margin: 0 0 0.85rem;
        color: #111;
        font-size: clamp(1.65rem, 3vw, 2.35rem);
        line-height: 1.15;
        font-weight: 700;
      }

      .wnExecTeam__summary {
        margin: 0;
        color: #444;
        font-size: clamp(0.95rem, 1.4vw, 1.05rem);
        line-height: 1.55;
      }

      .wnExecTeam__list {
        list-style: none;
        margin: 0 auto;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        max-width: 40rem;

      .wnExecTeam__card {
        background: #f7f7f7;
        border-radius: 1rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);

        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .wnExecTeam__avatar {
        width: clamp(8.5rem, 18vw, 10.5rem);
        height: clamp(8.5rem, 18vw, 10.5rem);
        border-radius: 50%;
        background: #1c66fc;
        display: grid;
        place-items: center;
        overflow: hidden;
        margin-bottom: 1.25rem;
        padding: 0.35rem;
        box-sizing: border-box;
      }

      .wnExecTeam__photo {
        width: 100%;
        height: 100%;
        border-radius: 50%;

        object-position: center top;
        filter: grayscale(1);

        background: #1c66fc;

      .wnExecTeam__name {
        margin: 0 0 0.35rem;
        color: #111;
        font-size: clamp(1.05rem, 1.6vw, 1.2rem);
        font-weight: 700;
        line-height: 1.25;

      .wnExecTeam__role {

        font-size: 0.72rem;
        font-weight: 600;

        text-transform: uppercase;
        line-height: 1.35;

      .wnExecTeam__cta {
        margin-top: clamp(1.75rem, 3vw, 2.25rem);
      }

          grid-template-columns: 1fr;
          max-width: 18rem;
        }

        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr);
        gap: clamp(1.75rem, 4vw, 3.5rem);
        align-items: center;
      }

      .wnMissionVision__heading {
        margin: 0 0 1rem;
        color: #111;
        font-size: clamp(1.65rem, 3vw, 2.35rem);
        line-height: 1.15;
        font-weight: 700;
      }

      .wnMissionVision__lede {
        margin: 0 0 1.5rem;

        font-size: clamp(0.98rem, 1.4vw, 1.08rem);
        line-height: 1.55;
        max-width: 28rem;
      }

      .wnMissionVision__cards {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .wnMissionVision__card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        padding: clamp(1.35rem, 2.5vw, 1.75rem) clamp(1.25rem, 2.5vw, 1.75rem);
      }

      .wnMissionVision__cardTitle {
        margin: 0 0 0.75rem;
        color: #1c66fc;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.35;
      }

      .wnMissionVision__cardBody p {
        margin: 0 0 0.85rem;
        color: #222;
        font-size: clamp(0.95rem, 1.3vw, 1.02rem);
        line-height: 1.55;
      }

      .wnMissionVision__cardBody p:last-child {
        margin-bottom: 0;
      }

      @media (max-width: 860px) {
        .wnMissionVision__inner {
          grid-template-columns: 1fr;
          gap: 1.75rem;
        }
      }

      /* Secure Your Web Apps callout — same primary blue gradient as bannerCta */
      .wnSecureAppsCta__bg {
        background-color: #050811 !important;
        background-image:
          linear-gradient(rgba(120, 160, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 160, 255, 0.06) 1px, transparent 1px),
          radial-gradient(ellipse 85% 75% at 72% 18%, rgba(0, 82, 255, 0.72) 0%, rgba(0, 45, 160, 0.35) 32%, transparent 68%),
          radial-gradient(ellipse 55% 45% at 55% 0%, rgba(40, 100, 220, 0.28) 0%, transparent 55%),
          linear-gradient(180deg, #050811 0%, #07101f 45%, #050811 100%) !important;
        background-size: 56px 56px, 56px 56px, cover, cover, cover !important;
        background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat !important;
        background-position: 0 0, 0 0, center, center, center !important;
      }

      /* Trust stats in Why WhiteNet right column */
      .eventsAndPress__press.trustStats {
        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: clamp(1.75rem, 3.5vw, 2.75rem) clamp(1.25rem, 3vw, 2.25rem) !important;
      }

      .trustStats__inner {
        display: flex;
        flex-direction: column;

        gap: 1.25rem;

      .trustStats__heading {
        width: 100%;
        text-align: center;
        border-bottom: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .eventsAndPress__press.trustStats .eventsAndPress__heading .eventsAndPress__title {
        text-transform: none;
        letter-spacing: normal;
        font-size: clamp(1.25rem, 2vw, 1.65rem);
        line-height: 1.25;
        text-align: center;
        margin: 0 auto;
      }

      .trustStats__intro {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 0;
        text-align: center;
      }

      .trustStats__intro .eventsAndPress__description {
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: clamp(0.95rem, 1.4vw, 1.05rem);
        line-height: 1.55;
        text-align: center;
      }

      .trustStats__metrics {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        width: 100%;
        margin-top: 0.5rem;
        justify-items: center;
      }

      @media screen and (min-width: 520px) {
        .trustStats__metrics {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 1rem;
        }
      }

      .trustStats__metric {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        width: 100%;
        max-width: 9.5rem;
        padding: 0.75rem 0.5rem;
      }

      .trustStats__ring {
        --current-percentage: 0;
        position: relative;
        width: 7.25rem;
        height: 7.25rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto 0.85rem;
        background:
          radial-gradient(circle at center, #131518 62%, transparent 63%),
          conic-gradient(
            from -90deg,
            #1c66fc 0deg,
            #3b82ff calc(var(--current-percentage) * 3.6deg),
            #1a2333 calc(var(--current-percentage) * 3.6deg),
            #1a2333 360deg
          );
      }

      .trustStats__value {
        position: relative;
        z-index: 1;
        color: #fff;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .trustStats__value::after {
        content: "%";
        font-size: 0.7em;
        margin-left: 0.05em;
      }

      .trustStats__label {
        display: block;
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.85rem;
        line-height: 1.35;
        text-align: center;
        letter-spacing: 0.01em;
      }

      /* Fit longer values like 7K+ / 13K+ in service stats */
      .tabbedContentStats__percentageValue {
        font-size: clamp(1.4rem, 2.2vw, 2rem) !important;
      }

      .tabbedContentStats__iconStatValue {
        font-size: clamp(1.75rem, 2.6vw, 2.35rem) !important;
      }

      /* Quote testimonial slider */
      .wnQuoteSlider {
        padding: clamp(3.5rem, 7vw, 5.75rem) 1.25rem;
      }

      .wnQuoteSlider__inner {
        width: min(920px, 100%);
        margin: 0 auto;
      }

      .wnQuoteSlider__frame {
        position: relative;
        
        color: #fff;
        padding: clamp(2.75rem, 5vw, 3.75rem) clamp(2rem, 5vw, 3.5rem) clamp(3.25rem, 5vw, 3.75rem);
        min-height: 18rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .wnQuoteSlider__mark {
        position: absolute;
        z-index: 2;
        width: 3.35rem;
        height: 3.35rem;
        display: grid;
        place-items: center;
        background: #2563eb;
        color: #fff;
        font-size: 2.35rem;
        font-weight: 700;
        line-height: 1;
        font-family: Georgia, "Times New Roman", serif;
      }

      .wnQuoteSlider__mark--open {
        top: 0;
        left: 0;
        transform: translate(-28%, -28%);
      }

      .wnQuoteSlider__mark--close {
        right: 0;
        bottom: 0;
        transform: translate(28%, 28%);
      }

      .wnQuoteSlider__viewport {
        position: relative;
        overflow: hidden;
      }

      .wnQuoteSlider__track {
        position: relative;
      }

      .wnQuoteSlider__slide {
        margin: 0;
        display: none;
        opacity: 0;
        transform: translateY(10px);
      }

      .wnQuoteSlider__slide.is-active {
        display: block;
        opacity: 1;
        transform: translateY(0);
        animation: wnQuoteFade 0.45s ease;
      }

      @keyframes wnQuoteFade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .wnQuoteSlider__quote {
        margin: 0;
        color: #fff;
        font-size: clamp(1rem, 1.7vw, 1.2rem);
        line-height: 1.65;
        font-weight: 500;
      }

      .wnQuoteSlider__author {
        margin-top: 1.6rem;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1rem;
        line-height: 1.4;
      }

      .wnQuoteSlider__author::before {
        content: "— ";
      }

      .wnQuoteSlider__name {
        font-weight: 700;
        color: #fff;
      }

      .wnQuoteSlider__nav {
        position: absolute;
        right: clamp(3.75rem, 7vw, 5rem);
        bottom: 1.1rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        z-index: 3;
      }

      .wnQuoteSlider__navBtn {
        appearance: none;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 1.55rem;
        line-height: 1;
        padding: 0.15rem 0.2rem;
        cursor: pointer;
      }

      .wnQuoteSlider__navBtn:hover {
        color: #60a5fa;
      }

      .wnQuoteSlider__navBtn:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 3px;
      }

      @media (max-width: 640px) {
        .wnQuoteSlider__mark {
          width: 2.6rem;
          height: 2.6rem;
          font-size: 1.8rem;
        }

        .wnQuoteSlider__nav {
          right: 2.6rem;
          bottom: 0.85rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wnQuoteSlider__slide.is-active {
          animation: none;
        }

      }

        color: #fff;

        letter-spacing: -0.02em;
